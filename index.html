<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10131a" />
    <meta name="description" content="Gem Front — a match-3 battle prototype. Swap gems, march units, destroy the enemy base." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Gem Front</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2310131a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23f0c43a'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body,
      #game {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #10131a;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
      }
      body {
        height: 100dvh;
      }
      #game {
        height: 100dvh;
      }
      #game canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
